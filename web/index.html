<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b0f17">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="FifafoFumar">
  <meta name="robots" content="noindex, nofollow">
  <title>FifafoFumar</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icono.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icono-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div id="app">
    <header class="barra">
      <div class="marca">
        <span class="marca-logo">🏆</span>
        <span class="marca-texto">Fifafo<b>Fumar</b></span>
      </div>
      <button class="selector-torneo" data-accion="elegir-torneo" aria-label="Cambiar de torneo">
        <span id="nombre-torneo">Cargando…</span>
        <span class="flecha">▾</span>
      </button>
      <button class="boton-icono" data-accion="actualizar" aria-label="Actualizar datos" id="boton-actualizar">
        <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M17.65 6.35A7.96 7.96 0 0 0 12 4a8 8 0 1 0 7.73 10h-2.08A6 6 0 1 1 12 6c1.66 0 3.14.69 4.22 1.78L13 11h7V4l-2.35 2.35z"/></svg>
      </button>
    </header>

    <main id="vista" tabindex="-1">
      <div class="cargando-pantalla"><div class="balon">⚽</div><p>Cargando la liga…</p></div>
    </main>

    <nav class="navegacion" aria-label="Secciones">
      <button data-vista="jornadas" class="activa"><span class="nav-icono">📅</span><span>Jornadas</span></button>
      <button data-vista="tabla"><span class="nav-icono">📊</span><span>Tabla</span></button>
      <button data-vista="goleo"><span class="nav-icono">⚽</span><span>Goleo</span></button>
      <button data-vista="historia"><span class="nav-icono">🏛️</span><span>Historia</span></button>
      <button data-vista="mas"><span class="nav-icono">⚙️</span><span>Más</span></button>
    </nav>
  </div>

  <div id="hoja-fondo" class="hoja-fondo" hidden></div>
  <section id="hoja" class="hoja" role="dialog" aria-modal="true" hidden></section>
  <div id="aviso" class="aviso" role="status" aria-live="polite"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
